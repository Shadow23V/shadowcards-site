<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ShadowCards</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background-image: url("promo.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-color: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Darken center-bottom area for readability */
    .overlay {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 70%, rgba(0,0,0,0.15), rgba(0,0,0,0.85)),
        linear-gradient(120deg, rgba(0,255,255,0.08), rgba(255,0,170,0.07), rgba(255,120,0,0.06));
      pointer-events: none;
    }

    .ui {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 42px; /* lift it up */
      display: flex;
      justify-content: center;
      padding: 0 16px;
      pointer-events: none;
    }

    /* === STRONGER PANEL === */
    .panel {
      pointer-events: auto;
      max-width: 820px;
      width: 100%;
      padding: 20px 22px;
      border-radius: 22px;
      background: rgba(0, 0, 0, 0.78);
      border: 2px solid rgba(0, 255, 255, 0.35);
      backdrop-filter: blur(14px);
      box-shadow:
        0 0 30px rgba(0,255,255,0.35),
        0 0 70px rgba(255,80,0,0.25),
        0 30px 80px rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .brand {
      min-width: 170px;
      color: #ffffff;
      line-height: 1.15;
    }

    .brand .title {
      font-weight: 900;
      letter-spacing: 2px;
      font-size: 1.05rem;
      text-transform: uppercase;
      text-shadow:
        0 0 14px rgba(0,255,255,0.9),
        0 0 26px rgba(255,0,170,0.6);
    }

    .brand .sub {
      margin-top: 6px;
      font-size: 0.85rem;
      opacity: 0.9;
    }

    /* === BIG COUNTDOWN === */
    .countdown {
      flex: 1;
      display: flex;
      justify-content: center;
      gap: 14px;
    }

    .unit {
      text-align: center;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(0,0,0,0.6);
      border: 2px solid rgba(255,80,0,0.35);
      min-width: 96px;
      box-shadow:
        inset 0 0 18px rgba(0,255,255,0.35),
        0 0 24px rgba(255,0,170,0.35);
    }

    .num {
      font-size: 2.2rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow:
        0 0 14px rgba(0,255,255,0.9),
        0 0 28px rgba(255,0,170,0.7);
    }

    .lbl {
      font-size: 0.75rem;
      letter-spacing: 1px;
      margin-top: 6px;
      opacity: 0.9;
    }

    .right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status {
      font-size: 0.8rem;
      padding: 8px 12px;
      border-radius: 999px;
      border: 2px solid rgba(0,255,255,0.5);
      background: rgba(0,0,0,0.55);
      text-shadow: 0 0 14px rgba(0,255,255,0.8);
    }

    .btn {
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff6a00, #ff2a00);
      color: #0b0b0f;
      font-weight: 900;
      border: none;
      box-shadow:
        0 0 22px rgba(255,100,0,0.8),
        0 0 40px rgba(255,0,0,0.5);
      white-space: nowrap;
    }

    @media (max-width: 900px) {
      .panel { flex-direction: column; gap: 16px; }
      .right { justify-content: center; }
    }

    @media (max-width: 480px) {
      .unit { min-width: 72px; padding: 10px; }
      .num { font-size: 1.7rem; }
    }
  </style>
</head>

<body>
  <div class="overlay"></div>

  <div class="ui">
    <div class="panel">
      <div class="brand">
        <div class="title">SHADOWCARDS</div>
        <div class="sub">Weekly reset • Monday</div>
      </div>

      <div class="countdown">
        <div class="unit"><div class="num" id="d">--</div><div class="lbl">DAYS</div></div>
        <div class="unit"><div class="num" id="h">--</div><div class="lbl">HRS</div></div>
        <div class="unit"><div class="num" id="m">--</div><div class="lbl">MIN</div></div>
        <div class="unit"><div class="num" id="s">--</div><div class="lbl">SEC</div></div>
      </div>

      <div class="right">
        <div class="status" id="status">RESET INCOMING</div>
        <a class="btn" href="https://opensea.io/collection/shadowcards" target="_blank">
          View on OpenSea
        </a>
      </div>
    </div>
  </div>

  <script>
    function nextMonday() {
      const now = new Date();
      const day = now.getDay();
      const diff = (8 - day) % 7 || 7;
      const monday = new Date(now);
      monday.setDate(now.getDate() + diff);
      monday.setHours(0, 0, 0, 0);
      return monday;
    }

    const el = {
      d: document.getElementById("d"),
      h: document.getElementById("h"),
      m: document.getElementById("m"),
      s: document.getElementById("s"),
      status: document.getElementById("status")
    };

    function pad(n) { return String(n).padStart(2, "0"); }

    function tick() {
      const now = new Date();
      let diff = nextMonday() - now;
      if (diff < 0) diff += 7 * 86400000;

      const t = Math.floor(diff / 1000);
      el.d.textContent = Math.floor(t / 86400);
      el.h.textContent = pad(Math.floor(t % 86400 / 3600));
      el.m.textContent = pad(Math.floor(t % 3600 / 60));
      el.s.textContent = pad(t % 60);

      el.status.textContent =
        t < 3600 ? "RESET IMMINENT" :
        t < 86400 ? "RESET TODAY" :
        "RESET INCOMING";
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
