<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ShadowCards</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background-image: url("promo.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-color: #000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 40%, rgba(0,0,0,0.2), rgba(0,0,0,0.75)),
        linear-gradient(120deg, rgba(0,255,255,0.08), rgba(255,0,170,0.07), rgba(255,120,0,0.06));
      pointer-events: none;
    }

    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.02),
        rgba(255,255,255,0.02) 1px,
        rgba(0,0,0,0.0) 3px,
        rgba(0,0,0,0.0) 6px
      );
      opacity: 0.25;
      pointer-events: none;
    }

    .ui {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 24px;
      display: flex;
      justify-content: center;
      padding: 0 16px;
      pointer-events: none;
    }

    .panel {
      pointer-events: auto;
      max-width: 760px;
      width: 100%;
      border-radius: 18px;
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(0, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      display: flex;
      gap: 14px;
      align-items: center;
      box-shadow: 0 18px 60px rgba(0,0,0,0.7);
    }

    .brand {
      min-width: 150px;
      color: #e6e6eb;
      line-height: 1.1;
    }

    .title {
      font-weight: 900;
      letter-spacing: 2px;
      font-size: 0.95rem;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(0,255,255,0.4);
      position: relative;
    }

    .sub {
      margin-top: 6px;
      font-size: 0.8rem;
      opacity: 0.8;
    }

    .countdown {
      flex: 1;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .unit {
      text-align: center;
      padding: 10px;
      border-radius: 14px;
      border: 1px solid rgba(255,0,170,0.2);
      background: rgba(0,0,0,0.35);
      min-width: 86px;
      box-shadow: inset 0 0 12px rgba(0,255,255,0.12);
    }

    .num {
      font-size: 1.6rem;
      font-weight: 900;
      text-shadow: 0 0 12px rgba(0,255,255,0.25);
    }

    .lbl {
      font-size: 0.7rem;
      opacity: 0.75;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    .right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status {
      font-size: 0.75rem;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(0,255,255,0.3);
      background: rgba(0,0,0,0.35);
      text-shadow: 0 0 10px rgba(0,255,255,0.4);
    }

    .btn {
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(255, 80, 0, 0.95);
      color: #0b0b0f;
      font-weight: 900;
      border: 1px solid rgba(255,130,50,0.95);
      white-space: nowrap;
    }

    @media (max-width: 820px) {
      .panel { flex-direction: column; }
      .right { justify-content: center; }
    }
  </style>
</head>

<body>
  <div class="overlay"></div>
  <div class="scanlines"></div>

  <div class="ui">
    <div class="panel">
      <div class="brand">
        <div class="title">SHADOWCARDS</div>
        <div class="sub">Weekly reset • Monday</div>
      </div>

      <div class="countdown">
        <div class="unit"><div class="num" id="d">--</div><div class="lbl">Days</div></div>
        <div class="unit"><div class="num" id="h">--</div><div class="lbl">Hours</div></div>
        <div class="unit"><div class="num" id="m">--</div><div class="lbl">Mins</div></div>
        <div class="unit"><div class="num" id="s">--</div><div class="lbl">Secs</div></div>
      </div>

      <div class="right">
        <div class="status" id="status">RESET INCOMING</div>
        <a class="btn" href="https://opensea.io/collection/shadowcards" target="_blank">
          View on OpenSea
        </a>
      </div>
    </div>
  </div>

  <script>
    function nextMonday() {
      const now = new Date();
      const day = now.getDay(); // Sun=0, Mon=1
      const diff = (8 - day) % 7 || 7;
      const monday = new Date(now);
      monday.setDate(now.getDate() + diff);
      monday.setHours(0, 0, 0, 0);
      return monday;
    }

    const els = {
      d: document.getElementById("d"),
      h: document.getElementById("h"),
      m: document.getElementById("m"),
      s: document.getElementById("s"),
      status: document.getElementById("status")
    };

    function pad(n) { return String(n).padStart(2, "0"); }

    function tick() {
      const now = new Date();
      const target = nextMonday();
      let diff = target - now;

      if (diff <= 0) diff += 7 * 24 * 60 * 60 * 1000;

      const total = Math.floor(diff / 1000);
      const days = Math.floor(total / 86400);
      const hours = Math.floor((total % 86400) / 3600);
      const mins = Math.floor((total % 3600) / 60);
      const secs = total % 60;

      els.d.textContent = days;
      els.h.textContent = pad(hours);
      els.m.textContent = pad(mins);
      els.s.textContent = pad(secs);

      els.status.textContent =
        days === 0 ? "RESET TODAY" :
        days === 1 ? "RESET TOMORROW" :
        "RESET INCOMING";
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
