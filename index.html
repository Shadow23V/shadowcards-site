<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Shadow23-V — Brand Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --glass: rgba(0,0,0,0.66);
      --text: #e6e6eb;
      --muted: rgba(230,230,235,0.75);

      --borderCyan: rgba(0,255,255,0.22);
      --borderOrange: rgba(255,90,0,0.34);
      --borderPurple: rgba(180,77,255,0.28);

      --radius: 18px;
      --radiusIn: 14px;

      --hFont: "Orbitron", system-ui, sans-serif;
      --uiFont: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: var(--uiFont);
      color: var(--text);
    }

    body {
      background-image: url("background.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-color: #000;
    }

    .veil {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, rgba(0,0,0,0.2), rgba(0,0,0,0.9));
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 1120px;
      margin: 0 auto;
      padding: 22px 16px 64px;
      display: grid;
      gap: 16px;
    }

    .panel {
      background: var(--glass);
      border: 1px solid var(--borderCyan);
      border-radius: var(--radius);
      padding: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 14px 60px rgba(0,0,0,0.65);
    }

    /* TOP BAR */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .brandRow {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid rgba(0,255,255,0.16);
    }

    .brandName {
      font-family: var(--hFont);
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 1.1rem;
    }

    .nav {
      display: flex;
      gap: 10px;
    }

    .nav a {
      text-decoration: none;
      color: rgba(230,230,235,0.88);
      font-weight: 800;
      font-size: 0.9rem;
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(0,255,255,0.1);
    }

    .btn {
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 14px;
      font-weight: 900;
      color: #0b0b0f;
      background: linear-gradient(135deg, #ff6a00, #ff2a00);
      box-shadow: 0 0 22px rgba(255,100,0,0.35);
    }

    .btnOutline {
      color: rgba(230,230,235,0.92);
      background: rgba(0,0,0,0.34);
      border: 1px solid rgba(0,255,255,0.2);
    }

    .btnTwitch {
      background: linear-gradient(135deg, #7a2bff, #ff3fb4);
      color: #0b0b0f;
    }

    /* HERO */
    .promoCard {
      border: 1px solid var(--borderOrange);
      padding: 14px;
    }

    .promoImg {
      width: 100%;
      border-radius: var(--radiusIn);
    }

    /* SECTIONS */
    .sectionHead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .sectionTitle {
      font-family: var(--hFont);
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 1rem;
      margin: 0;
    }

    .zoneCards { border-color: var(--borderOrange); }
    .zoneTwitch { border-color: var(--borderPurple); }

    /* COUNTDOWN */
    .countdownRow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .units {
      display: flex;
      gap: 10px;
    }

    .unit {
      min-width: 92px;
      text-align: center;
      padding: 10px;
      border-radius: 14px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(0,255,255,0.22);
    }

    .num {
      font-size: 1.4rem;
      font-weight: 900;
    }

    .lbl {
      font-size: 0.75rem;
      text-transform: uppercase;
      opacity: 0.8;
    }

    .footer {
      text-align: center;
      opacity: 0.6;
      font-size: 0.85rem;
    }
  </style>
</head>

<body>
<div class="veil"></div>

<main class="wrap">

  <!-- TOP BAR -->
  <section class="panel topbar">
    <div class="brandRow">
      <img class="logo" src="Logo.png" alt="Shadow23-V Logo" onerror="this.style.display='none'">
      <div class="brandName">Shadow23-V</div>
    </div>

    <nav class="nav">
      <a href="#cards">ShadowCards</a>
      <a href="#twitch">Twitch</a>
    </nav>

    <a class="btn" href="#cards">Explore Cards</a>
  </section>

  <!-- HERO -->
  <section class="panel promoCard">
    <img class="promoImg" src="promo.png" alt="Shadow23-V Promo">
  </section>

  <!-- SHADOWCARDS -->
  <section class="panel zoneCards" id="cards">
    <div class="sectionHead">
      <h3 class="sectionTitle">ShadowCards</h3>

      <div style="display:flex; flex-direction:column; gap:8px;">
        <a class="btn"
           href="https://opensea.io/collection/shadowcards"
           target="_blank">
          OpenSea Collection
        </a>

        <a class="btn btnOutline"
           href="https://opensea.io/item/avalanche/0x2db242c6b4e9abe6d88530370bba54e7eab4eaf4/4"
           target="_blank">
          Latest Release
        </a>
      </div>
    </div>

    <div class="countdownRow">
      <div>
        <strong>Next ShadowCards Drop</strong><br>
        Drops every Monday at 12:00 AM (local time)
      </div>

      <div class="units">
        <div class="unit"><div class="num" id="d">--</div><div class="lbl">Days</div></div>
        <div class="unit"><div class="num" id="h">--</div><div class="lbl">Hours</div></div>
        <div class="unit"><div class="num" id="m">--</div><div class="lbl">Minutes</div></div>
        <div class="unit"><div class="num" id="s">--</div><div class="lbl">Seconds</div></div>
      </div>
    </div>
  </section>

  <!-- TWITCH -->
  <section class="panel zoneTwitch" id="twitch">
    <div class="sectionHead">
      <h3 class="sectionTitle">Twitch</h3>
      <a class="btn btnTwitch"
         href="https://www.twitch.tv/shadow23v"
         target="_blank">
        Watch on Twitch
      </a>
    </div>
  </section>

  <div class="footer">© <span id="year"></span> Shadow23-V</div>

</main>

<script>
  function nextMonday() {
    const now = new Date();
    const day = now.getDay();
    const diff = (8 - day) % 7 || 7;
    const d = new Date(now);
    d.setDate(now.getDate() + diff);
    d.setHours(0,0,0,0);
    return d;
  }

  function pad(n){ return String(n).padStart(2,"0"); }

  function tick(){
    const diff = nextMonday() - new Date();
    const t = Math.max(0, Math.floor(diff/1000));
    document.getElementById("d").textContent = Math.floor(t/86400);
    document.getElementById("h").textContent = pad(Math.floor((t%86400)/3600));
    document.getElementById("m").textContent = pad(Math.floor((t%3600)/60));
    document.getElementById("s").textContent = pad(t%60);
  }

  document.getElementById("year").textContent = new Date().getFullYear();
  tick();
  setInterval(tick,1000);
</script>

</body>
</html>
