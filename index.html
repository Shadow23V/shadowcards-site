<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ShadowCards</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root{
      --glass: rgba(0,0,0,0.65);
      --borderCyan: rgba(0,255,255,0.28);
      --borderOrange: rgba(255,90,0,0.35);
      --text: #e6e6eb;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    /* UPDATED: main site background */
    body {
      background-image: url("background.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-color: #000;
    }

    /* Helps readability on busy backgrounds */
    .veil {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, rgba(0,0,0,0.25), rgba(0,0,0,0.85));
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 16px 60px;
      display: grid;
      gap: 18px;
    }

    .panel {
      background: var(--glass);
      border: 1px solid var(--borderCyan);
      border-radius: 18px;
      padding: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 14px 60px rgba(0,0,0,0.65);
    }

    /* HEADER */
    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 1.2rem;
      text-shadow: 0 0 14px rgba(0,255,255,0.35);
    }

    .tagline {
      opacity: 0.85;
      font-size: 0.95rem;
    }

    /* PROMO */
    .promoCard {
      border: 1px solid var(--borderOrange);
      box-shadow:
        0 0 24px rgba(255,90,0,0.18),
        0 0 40px rgba(0,255,255,0.10),
        0 16px 70px rgba(0,0,0,0.75);
    }

    .promoImg {
      width: 100%;
      display: block;
      border-radius: 14px;
      border: 1px solid rgba(255,90,0,0.28);
      box-shadow: 0 0 30px rgba(255,60,0,0.22);
    }

    /* COUNTDOWN */
    .countdownRow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .countTitle {
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 0.95rem;
      opacity: 0.95;
    }

    .units {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .unit {
      min-width: 92px;
      text-align: center;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(0,255,255,0.22);
      box-shadow: inset 0 0 14px rgba(0,255,255,0.12);
    }

    .num {
      font-size: 1.45rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 12px rgba(0,255,255,0.25);
    }

    .lbl {
      margin-top: 6px;
      font-size: 0.78rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .status {
      font-size: 0.85rem;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,90,0,0.35);
      background: rgba(0,0,0,0.55);
      box-shadow: 0 0 18px rgba(255,90,0,0.14);
      white-space: nowrap;
    }

    /* LINKS */
    .links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
    }

    .btn {
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 14px;
      font-weight: 900;
      letter-spacing: 0.4px;
      color: #0b0b0f;
      background: linear-gradient(135deg, #ff6a00, #ff2a00);
      box-shadow: 0 0 22px rgba(255,100,0,0.35);
      white-space: nowrap;
    }

    .btn.secondary {
      background: linear-gradient(135deg, #00ffff, #ff00aa);
      box-shadow: 0 0 22px rgba(0,255,255,0.25);
    }

    @media (max-width: 700px) {
      .header { flex-direction: column; align-items: flex-start; }
      .links { justify-content: flex-start; }
      .unit { min-width: 84px; }
    }
  </style>
</head>

<body>
  <div class="veil"></div>

  <main class="wrap">
    <!-- HEADER -->
    <section class="panel header">
      <div>
        <div class="brand">SHADOWCARDS</div>
        <div class="tagline">Weekly drops • Monday reset</div>
      </div>

      <div class="links">
        <a class="btn" href="https://opensea.io/collection/shadowcards" target="_blank" rel="noopener noreferrer">
          View on OpenSea
        </a>

        <a class="btn secondary" href="https://www.twitch.tv/shadow23v" target="_blank" rel="noopener noreferrer">
          Watch on Twitch
        </a>
      </div>
    </section>

    <!-- PROMO -->
    <section class="panel promoCard">
      <img class="promoImg" src="promo.png" alt="ShadowCards Promo" />
    </section>

    <!-- COUNTDOWN -->
    <section class="panel">
      <div class="countdownRow">
        <div>
          <div class="countTitle">Countdown to Monday Reset</div>
          <div class="tagline" style="margin-top:6px;">Resets every Monday at 12:00 AM (local time)</div>
        </div>

        <div class="units">
          <div class="unit"><div class="num" id="d">--</div><div class="lbl">Days</div></div>
          <div class="unit"><div class="num" id="h">--</div><div class="lbl">Hours</div></div>
          <div class="unit"><div class="num" id="m">--</div><div class="lbl">Minutes</div></div>
          <div class="unit"><div class="num" id="s">--</div><div class="lbl">Seconds</div></div>
        </div>

        <div class="status" id="status">RESET INCOMING</div>
      </div>
    </section>
  </main>

  <script>
    function nextMondayLocalMidnight() {
      const now = new Date();
      const day = now.getDay();
      const diff = (8 - day) % 7 || 7;
      const monday = new Date(now);
      monday.setDate(now.getDate() + diff);
      monday.setHours(0, 0, 0, 0);
      return monday;
    }

    const el = {
      d: document.getElementById("d"),
      h: document.getElementById("h"),
      m: document.getElementById("m"),
      s: document.getElementById("s"),
      status: document.getElementById("status")
    };

    function pad(n) { return String(n).padStart(2, "0"); }

    function tick() {
      const now = new Date();
      let diff = nextMondayLocalMidnight() - now;
      if (diff < 0) diff += 7 * 86400000;

      const t = Math.floor(diff / 1000);
      el.d.textContent = Math.floor(t / 86400);
      el.h.textContent = pad(Math.floor((t % 86400) / 3600));
      el.m.textContent = pad(Math.floor((t % 3600) / 60));
      el.s.textContent = pad(t % 60);

      el.status.textContent =
        t < 3600 ? "RESET IMMINENT" :
        t < 86400 ? "RESET TODAY" :
        "RESET INCOMING";
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
